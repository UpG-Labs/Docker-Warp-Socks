name: build

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "local"
    paths:
      - "Dockerfile"
      - "entrypoint.sh"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert tags to lowercase
        run: |
          ghcr_tag="ghcr.io/${{ github.repository }}"
          repository="${{ github.repository }}"
          repo_name="${repository#*/}"
          echo "ghcr_tag=${ghcr_tag,,}" >> $GITHUB_ENV
          echo "repo_name=${repo_name,,}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}"
          file: Dockerfile
          push: true
          platforms: linux/amd64, linux/arm64, linux/s390x, linux/arm, linux/ppc64le, linux/riscv64
          tags: |
            ${{ env.ghcr_tag }}
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Connect to CloudFlare WARP exposing SOCKS5 proxy all together.
          cache-from: type=gha
          cache-to: type=gha,mode=max